
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101522">
  <title>CallSpace — Chamadas de vídeo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>CallSpace</h1>
    <p>Conecte-se com seus amigos.</p>
  </header>

  <main>
    <section id="home">
      <h2>Sua próxima conversa começa aqui.</h2>
      <button id="createRoom" type="button">Criar sala</button>

      <div>
        <input
          id="roomCode"
          type="text"
          placeholder="Digite o código da sala"
          autocomplete="off"
        >
        <button id="joinRoom" type="button">Entrar na sala</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
