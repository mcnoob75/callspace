<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CallSpace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>🌐 CallSpace</h2>
        <span>Conecte-se com seus amigos</span>
    </header>

    <main>
        <section class="welcome">
            <h1>Suas chamadas,<br>do seu jeito.</h1>
            <p>Faça chamadas de vídeo e áudio com quem você quiser.</p>

            <button id="createRoom">＋ Criar uma sala</button>

            <div class="join">
                <input
                    type="text"
                    id="roomCode"
                    placeholder="Digite o código da sala"
                >
                <button id="joinRoom">Entrar</button>
            </div>
        </section>

        <footer>
            Feito para conectar pessoas ❤️
        </footer>
    </main>

    <script src="app.js"></script>
</body>
</html>
